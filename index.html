<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Super Plumber Quest: an NES-style side-scrolling platformer with 8 worlds and 32 levels. Plays in the browser with a keyboard or touch.">
  <title>Super Plumber Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fca044'/%3E%3Crect x='0' y='0' width='16' height='1' fill='%23c84c0c'/%3E%3Cpath d='M5 4h6v2H9v2H7V6H5zM7 10h2v2H7z' fill='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wrap">
    <canvas id="screen" width="256" height="240" aria-label="Game screen"></canvas>
  </main>
  <div id="touch" aria-hidden="true">
    <div id="dpad">
      <span class="arrow l"></span><span class="arrow r"></span><span class="arrow u"></span><span class="arrow d"></span>
    </div>
    <div id="sys">
      <button data-k="mute">♪</button>
      <button data-k="start">START</button>
    </div>
    <div id="ab">
      <button class="b" data-k="run">B</button>
      <button class="a" data-k="jump">A</button>
    </div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
